<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Billie Eilish TV</title>
  <link rel="icon" href="/assets/icons/favicon-home-pc.ico?v=20260807-home-site-v1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-home-pc-32x32.png?v=20260807-home-site-v1">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20260807-betv-logo-v4">
  <style>
    :root{
      color-scheme:dark;
      --text:#f7f8fb;
      --muted:rgba(247,248,251,.66);
      --line:rgba(255,255,255,.16);
      --glass:rgba(16,18,23,.50);
      --glass-strong:rgba(11,13,18,.66);
      --blue:#4389f7;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      min-height:100svh;
      overflow:hidden;
      color:var(--text);
      background:#090b10 url('/assets/images/pages/404-bg.png') 62% 48% / cover no-repeat fixed;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(90deg,rgba(4,6,10,.26) 0%,rgba(4,6,10,.18) 42%,rgba(4,6,10,.66) 100%),
        linear-gradient(180deg,rgba(2,3,6,.18),rgba(2,3,6,.66));
      pointer-events:none;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 72% 47%,rgba(255,255,255,.07),transparent 34%);
      pointer-events:none;
    }
    .page{
      position:relative;
      z-index:1;
      min-height:100svh;
      width:min(1240px,calc(100% - 48px));
      margin:auto;
      padding:max(24px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .brand{
      width:74px;
      height:66px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      background:rgba(9,11,16,.36);
      -webkit-backdrop-filter:blur(22px) saturate(135%);
      backdrop-filter:blur(22px) saturate(135%);
      box-shadow:0 14px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
    }
    .brand img{width:56px;height:52px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
    .content{display:flex;align-items:center;justify-content:flex-end;padding:32px 0}
    .card{
      width:min(510px,100%);
      padding:clamp(28px,5vw,48px);
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.025) 48%,rgba(5,7,11,.42)),var(--glass);
      -webkit-backdrop-filter:blur(30px) saturate(145%);
      backdrop-filter:blur(30px) saturate(145%);
      box-shadow:0 36px 100px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.13);
    }
    .eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 22px;color:rgba(255,255,255,.62);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .eyebrow::before{content:"";width:28px;height:1px;background:rgba(255,255,255,.48)}
    .code{margin:4px 0 0;font-size:clamp(78px,12vw,132px);font-weight:850;line-height:.78;letter-spacing:-.085em;text-shadow:0 12px 34px rgba(0,0,0,.28)}
    h1{margin:28px 0 12px;font-size:clamp(30px,4vw,43px);line-height:1.04;letter-spacing:-.045em}
    p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:30px}
    .button{
      min-height:50px;
      padding:0 21px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      color:#fff;
      background:rgba(255,255,255,.08);
      text-decoration:none;
      font-size:14px;
      font-weight:780;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.20);
      transition:transform .18s ease,background .18s ease,border-color .18s ease;
    }
    .button:hover{transform:translateY(-1px);background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25)}
    .button.primary{background:var(--blue);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 13px 30px rgba(32,101,214,.28)}
    .button.primary:hover{background:#5797fb}
    .button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .footer{justify-self:end;color:rgba(255,255,255,.45);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    @media(min-width:761px) and (min-aspect-ratio:16/10){
      body{background-size:108% auto;background-position:62% 48%}
    }
    @media(max-width:760px){
      body{overflow:auto;background-position:42% center;background-attachment:scroll;background-size:cover}
      body::before{background:linear-gradient(180deg,rgba(3,5,8,.25),rgba(3,5,8,.74))}
      .page{width:calc(100% - 24px);min-height:100svh}
      .brand{width:64px;height:58px;border-radius:19px}.brand img{width:48px;height:45px}
      .content{justify-content:center;padding:30px 0 22px}
      .card{padding:29px 23px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.025)),var(--glass-strong)}
      .footer{justify-self:center}
    }
    @media(max-width:420px){.actions{display:grid}.button{width:100%}.code{font-size:84px}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="/" aria-label="Voltar para a página inicial">
      <img loading="eager" decoding="async" fetchpriority="high" src="/assets/images/brand/logo.png?v=20260807-betv-logo-v4" alt="BE">
    </a>

    <section class="content" aria-labelledby="error-title">
      <div class="card">
        <div class="code" aria-hidden="true">404</div>
        <h1 id="error-title">Essa página saiu do roteiro.</h1>
        <p id="error-description">O endereço pode ter mudado, sido removido ou nunca ter existido. Volte ao início para continuar explorando o site.</p>
        <div class="actions">
          <a class="button primary" id="error-home" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
            <span id="error-home-label">Voltar ao início</span>
          </a>
          <button class="button" id="error-back" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span id="error-back-label">Página anterior</span>
          </button>
        </div>
      </div>
    </section>

  </main>
  <script>
    (function(){
      var first=String(location.pathname.split('/')[1]||'').toLowerCase();
      var slug=['pt-br','en-us','es'].includes(first)?first:'';
      if(!slug){
        try{slug=String(localStorage.getItem('betvPreferredLocale')||'').toLowerCase();}catch(_){slug='';}
      }
      if(!['pt-br','en-us','es'].includes(slug)){
        var lang=String(navigator.language||'').toLowerCase();
        slug=lang.indexOf('es')===0?'es':lang.indexOf('en')===0?'en-us':'pt-br';
      }
      var copy={
        'pt-br':{lang:'pt-BR',title:'Essa página saiu do roteiro.',description:'O endereço pode ter mudado, sido removido ou nunca ter existido. Volte ao início para continuar explorando o site.',home:'Voltar ao início',back:'Página anterior'},
        'en-us':{lang:'en-US',title:'This page left the script.',description:'The address may have changed, been removed, or never existed. Return home to keep exploring the site.',home:'Back to home',back:'Previous page'},
        'es':{lang:'es',title:'Esta página se salió del guion.',description:'La dirección puede haber cambiado, haber sido eliminada o no haber existido nunca. Vuelve al inicio para seguir explorando el sitio.',home:'Volver al inicio',back:'Página anterior'}
      }[slug];
      document.documentElement.lang=copy.lang;
      document.getElementById('error-title').textContent=copy.title;
      document.getElementById('error-description').textContent=copy.description;
      document.getElementById('error-home-label').textContent=copy.home;
      document.getElementById('error-back-label').textContent=copy.back;
      var prefix='/'+slug;
      document.getElementById('error-home').href=prefix;
      document.querySelector('.brand').href=prefix;
      document.querySelector('.brand').setAttribute('aria-label',copy.home);
      document.getElementById('error-back').onclick=function(){history.length>1?history.back():location.assign(prefix);};
    })();
  </script>
  <script defer src="/assets/js/lazy-loading.js?v=1"></script>
</body>
</html>
