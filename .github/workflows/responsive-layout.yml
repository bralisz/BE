name: Responsive layout checks
on:
  push:
    branches: [main]
    paths: ['assets/**', '_static/**', 'index.html', 'scripts/**', '.github/workflows/responsive-layout.yml']
  pull_request:
    paths: ['assets/**', '_static/**', 'index.html', 'scripts/**', '.github/workflows/responsive-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-static-css.cjs
      - run: node scripts/test-album-layout.cjs
      - run: node scripts/test-profile-watch-click.cjs
      - run: node scripts/test-section-navigation.cjs
      - run: node scripts/test-profile-desktop-heart.cjs
      - run: node scripts/test-profile-follow.cjs
      - run: node scripts/test-mobile-nav-loading.cjs
