name: Restore follower UI
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good frontend
        run: git checkout de43c848368a226dd6670f68d93338d8d66350e0 -- assets/js/site.js
      - name: Commit restored frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js
          git diff --cached --quiet || git commit -m 'fix: restore public follow frontend'
          git push
