name: Fix follower counts
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch public profile counts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/api-routes/public-profile.js')
          s = p.read_text()
          old = "const payload = { ...profile, followersCount: stats.followersCount, followingCount: stats.followingCount };"
          new = "const payload = { ...profile, followersCount: Math.max(Number(profile.followersCount || 0), Number(stats.followersCount || 0)), followingCount: stats.followingCount };"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          rm -f assets/js/site.js.tmp assets/js/site.js.tmp2 assets/js/site.js.tmp3 assets/js/site.js.tmp4 assets/js/site.js.tmp5 assets/js/site.js.tmp6 assets/js/site.js.tmp7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/api-routes/public-profile.js assets/js/site.js.tmp*
          git diff --cached --quiet || git commit -m 'fix: preserve follower count from public profile'
          git push
